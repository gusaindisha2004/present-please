services:
  - type: web
    name: present-please-backend
    runtime: python
    rootDir: backend
    plan: starter
    healthCheckPath: /health
    buildCommand: "pip install -r requirements.txt && pip install --no-deps resemblyzer==0.1.4"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.7
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
